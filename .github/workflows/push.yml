name: push

# Applies every managed zone to Cloudflare. Only ever runs on main, and only
# after the check job has passed on the merge commit.
#
# Required secret: CLOUDFLARE_API_TOKEN with Zone.DNS edit permission on all
# zones listed in domains/_meta.json.

on:
  push:
    branches:
      - main
    paths:
      - 'domains/**'
      - 'dnsconfig.js'

# Never apply two dnscontrol pushes at once. Overlapping runs would race on
# the Cloudflare API and leave the zones in an undefined state.
concurrency:
  group: dns-push
  cancel-in-progress: false

jobs:
  push:
    name: Push DNS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # dnsconfig.js reads domains/*.json at runtime, so a push always applies
      # exactly what is committed; this re-runs the validator as a backstop.
      - name: Validate registry
        run: npm run check

      - name: DNSControl push
        uses: HisokaLabs/dnscontrol-actions@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          args: push

      # The site under is-a.ceo is a static render of this registry, so a DNS
      # push must be followed by a rebuild or the pages drift from the data.
      # Cross-repo dispatch needs a PAT: the default GITHUB_TOKEN cannot write
      # to another repository. Without the secret this step is skipped, and the
      # hourly rebuild in is-a.ceo/.github/workflows/pages.yml covers it.
      - name: Rebuild the site
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set; the hourly rebuild will pick this up."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HisokaLabs/is-a.ceo/dispatches \
            -d '{"event_type":"registry-updated"}'
